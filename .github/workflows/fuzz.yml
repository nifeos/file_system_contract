name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz-file_system_contract:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@7686d5bf752584f87ce96b46017ede92ed6ba10d
    with:
      manifest-path: file_system_contract/Cargo.toml
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: false
  fuzz-file_system_fixture:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@7686d5bf752584f87ce96b46017ede92ed6ba10d
    with:
      manifest-path: file_system_fixture/Cargo.toml
      public-crash-inputs: false
