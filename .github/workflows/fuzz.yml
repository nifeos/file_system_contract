name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz-file_system_contract:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@eef0a564a45656471bedcb93e4789f507387bc89
    with:
      manifest-path: file_system_contract/Cargo.toml
      # Crash inputs are public. Set true only for a crate with no unsafe code: this one has none.
      public-crash-inputs: true
  fuzz-file_system_fixture:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@eef0a564a45656471bedcb93e4789f507387bc89
    with:
      manifest-path: file_system_fixture/Cargo.toml
      public-crash-inputs: false
