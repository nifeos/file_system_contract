name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC. Print the line with
    # `python3 helpers/mutation_plan.py schedule <repository name>` in the template checkout.
    - cron: '39 8,10,12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation-file_system_contract:
    uses: nifeos/crate-workflows/.github/workflows/mutation.yml@7686d5bf752584f87ce96b46017ede92ed6ba10d
    with:
      manifest-path: file_system_contract/Cargo.toml
  mutation-file_system_fixture:
    uses: nifeos/crate-workflows/.github/workflows/mutation.yml@7686d5bf752584f87ce96b46017ede92ed6ba10d
    with:
      manifest-path: file_system_fixture/Cargo.toml
