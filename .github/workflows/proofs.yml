name: proofs
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  proofs-file_system_contract:
    uses: partsfoundry/crate-workflows/.github/workflows/proofs.yml@11d6d6bbf760462fa1e45275d34b55b88dcde44a
    with:
      manifest-path: file_system_contract/Cargo.toml
