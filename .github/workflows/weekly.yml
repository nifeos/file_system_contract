name: weekly
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekly-file_system_contract:
    uses: nifeos/crate-workflows/.github/workflows/weekly.yml@7686d5bf752584f87ce96b46017ede92ed6ba10d
    with:
      manifest-path: file_system_contract/Cargo.toml
    secrets:
      SETTINGS_TOKEN: ${{ secrets.SETTINGS_TOKEN }}
  weekly-file_system_fixture:
    uses: nifeos/crate-workflows/.github/workflows/weekly.yml@7686d5bf752584f87ce96b46017ede92ed6ba10d
    with:
      manifest-path: file_system_fixture/Cargo.toml
      # The settings drift is the repository's, and the first call reads it. The stranger cadence
      # is the crate's own, and this one passes over itself because it may not be published.
      settings-drift: false
